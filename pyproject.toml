[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yookassax"
dynamic = ["version"]
description = "Unofficial YooKassa API client for Python: sync and async, typed models, webhooks, idempotency and retries out of the box"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "yookassa",
    "yoomoney",
    "payments",
    "payment-gateway",
    "webhooks",
    "async",
    "asyncio",
    "httpx",
    "sdk",
    "юкасса",
    "платежи",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyyaml>=6",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Sepera-okeq/yookassax"
Documentation = "https://github.com/Sepera-okeq/yookassax#readme"
Examples = "https://github.com/Sepera-okeq/yookassax/tree/main/docs/examples"
Source = "https://github.com/Sepera-okeq/yookassax"
Changelog = "https://github.com/Sepera-okeq/yookassax/releases"
Issues = "https://github.com/Sepera-okeq/yookassax/issues"

[tool.hatch.version]
path = "src/yookassax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yookassax"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
