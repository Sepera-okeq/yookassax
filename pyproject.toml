[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yookassax"
dynamic = ["version"]
description = "Клиент ЮKassa для Python: синхронный и асинхронный, типизированные модели, вебхуки и идемпотентность из коробки"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["yookassa", "payments", "async", "sdk", "юкасса"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Sepera-okeq/yookassax"
Issues = "https://github.com/Sepera-okeq/yookassax/issues"

[tool.hatch.version]
path = "src/yookassax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yookassax"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
