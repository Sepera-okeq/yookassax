# Поиск утёкших секретов через GitGuardian.
#
# Библиотека платёжная: секретный ключ магазина или OAuth-токен, попавший в
# пример, историю или тест, это чужие деньги. Отозвать ключ после публикации
# репозитория поздно, поэтому проверка стоит до слияния.
#
# Нужен ключ API GitGuardian в секретах репозитория под именем
# GITGUARDIAN_API_KEY: Settings -> Secrets and variables -> Actions.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ggshield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история: сканируются все коммиты диапазона, а не только
          # верхушка. Секрет чаще всего лежит в коммите, который потом
          # "исправили" следующим, но из истории он никуда не делся.
          fetch-depth: 0

      - uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
